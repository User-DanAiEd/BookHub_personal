<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>BookHub — Recommendations</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet"/>
  <style>
    body { background:#0b1220; color:#e6eef8; font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,"Helvetica Neue",Arial;}
    .card { background:#0f1724; border:1px solid rgba(255,255,255,0.03); border-radius:12px; padding:14px; }
    .placeholder { background:#121826; display:flex;align-items:center;justify-content:center;color:#93c5fd;height:160px;width:100%;border-radius:8px;font-size:14px; }
    .stars { color:#facc15; }
    .muted { color:#9fb0cc; }
    .small { font-size:0.85rem; }
    #message { position:fixed; top:1rem; left:50%; transform:translateX(-50%); background:#111827;color:#fff;padding:8px 14px;border-radius:8px; display:none; z-index:50;}
    .back-button-container {
        width: 100%;
        max-width: 80rem;
        margin-bottom: 1rem;
    }
    .back-button-link {
        color: #3b82f6;
        font-weight: 600;
        cursor: pointer;
        text-decoration: none;
        font-size: 1rem;
        display: inline-flex;
        align-items: center;
        gap: 0.25rem;
    }
    .back-button-link:hover {
        color: #2563eb;
        text-decoration: underline;
    }
  </style>
</head>
<body class="min-h-screen p-6">
  <div id="message"></div>

  <div class="max-w-5xl mx-auto">
    <div class="back-button-container">
        <a href="/bookTracking" class="back-button-link">&#8592; Back to Book Tracking</a>
    </div>
    <header class="flex items-center justify-between mb-6">
      <h1 class="text-2xl font-bold">BookHub Recommendations</h1>
      <div id="userBox" class="text-sm muted"></div>
    </header>

    <section class="mb-6 card">
      <div class="flex gap-4 items-center">
        <input id="tagInput" placeholder="Enter tags (comma separated) or ?tags= in URL" class="w-2/3 bg-transparent border rounded px-3 py-2 small" />
        <button id="fetchBtn" class="px-4 py-2 rounded bg-blue-600 hover:bg-blue-700">Fetch</button>

        <div class="ml-auto flex items-center gap-3" style="display: none;">
          <label class="small muted">Collaborative α</label>
          <input id="alphaSlider" type="range" min="0" max="1" step="0.1" value="0.5" />
          <span id="alphaVal" class="ml-1 small">0.5</span>
          <label class="ml-4 small muted">Show scores</label>
          <input id="scoreToggle" type="checkbox" class="ml-1" />
        </div>
      </div>

      <div class="mt-3 text-sm muted" style="position:relative; display: none;">
        Mode:
        <button id="modeBtn" class="ml-2 px-2 py-1 rounded bg-slate-700 small" style="position:relative;">
          Hybrid
          <span id="modeTooltip" style="display:none; position:absolute; left:110%; top:50%; transform:translateY(-50%); background:#1e293b; color:#f1f5f9; padding:8px 12px; border-radius:8px; font-size:0.95rem; white-space:nowrap; z-index:10;">
            <strong>Hybrid:</strong> Combines your reading history and book content for recommendations.<br>
            <strong>Content:</strong> Uses book tags, genres, and descriptions only.
          </span>
        </button>
      </div>
    </section>

    <section id="resultsWrap" class="grid gap-4 grid-cols-1 md:grid-cols-2 lg:grid-cols-3"></section>

    <div id="noResults" class="mt-6 text-center muted hidden">No recommendations found.</div>
  </div>

  <!-- Firebase (for auth) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

    // Use same firebase config as your app (must match project)
    const firebaseConfig = {
      apiKey: "AIzaSyCTbjfadYocNBVdQpo_KzuW5JEtZS38Pkw",
      authDomain: "bookhub-80381.firebaseapp.com",
      projectId: "bookhub-80381",
      storageBucket: "bookhub-80381.firebasestorage.app",
      messagingSenderId: "525454852384",
      appId: "1:525454852384:web:1910c936f8062125779745"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    let currentUser = null;
    let currentIdToken = null;

    const userBox = document.getElementById('userBox');
    onAuthStateChanged(auth, async (u) => {
      currentUser = u;
      if (u) {
        userBox.textContent = u.email ? `Signed in: ${u.email}` : `User: ${u.uid}`;
        try {
          currentIdToken = await u.getIdToken();
        } catch (err) {
          console.warn("Could not get ID token:", err);
          currentIdToken = null;
        }
      } else {
        // Prevent unauthorized access and ID generation
        document.body.innerHTML = `<div style='display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;background:#0b1220;color:#e6eef8;font-family:Inter,sans-serif;'><h2 style='margin-bottom:1.5rem;'>You must be logged in to view recommendations.</h2><div style='display:flex;gap:2rem;'><a href='/login' style='background:#14b8a6;color:#fff;padding:0.75rem 2rem;border-radius:8px;text-decoration:none;font-weight:600;'>Go to Login</a><a href='/register' style='background:#06b6d4;color:#fff;padding:0.75rem 2rem;border-radius:8px;text-decoration:none;font-weight:600;'>Register</a></div></div>`;
        setTimeout(() => {
          window.location.href = "/login";
        }, 3500);
        return;
      }
    });

    // UI refs
    const resultsWrap = document.getElementById('resultsWrap');
    const fetchBtn = document.getElementById('fetchBtn');
    const tagInput = document.getElementById('tagInput');
    const alphaSlider = document.getElementById('alphaSlider');
    const alphaVal = document.getElementById('alphaVal');
    const modeBtn = document.getElementById('modeBtn');
    const modeTooltip = document.getElementById('modeTooltip');
    const scoreToggle = document.getElementById('scoreToggle');
    const noResults = document.getElementById('noResults');
    const message = document.getElementById('message');

    let currentMode = 'hybrid'; // or 'content'
    let showScores = false;

    function showMessage(text, timeout=2500) {
      message.style.display = 'block';
      message.textContent = text;
      setTimeout(()=> message.style.display='none', timeout);
    }

    // Read tags from URL ?tags= a,b,c
    function parseUrlTags() {
      const params = new URLSearchParams(window.location.search);
      const tagsParam = params.get('tags') || params.get('tag') || '';
      if (tagsParam) return tagsParam.split(',').map(s => s.trim()).filter(Boolean);
      return [];
    }

    // Render one book card
    function renderCard(book, scoreInfo=null) {
      const div = document.createElement('div');
      div.className = 'card';

      const cover = book.coverUrl || book.cover || book.coverUrl || 'https://placehold.co/160x240/333333/cccccc?text=No+Cover';
      const title = book.title || book.name || 'Untitled';
      const authors = book.author || book.authors || book.by || '';
      const rated_by = book.rated_by || book.ratedBy || book.owner || 'Unknown';
      const rating = (book.rating !== undefined && book.rating !== null) ? book.rating : (book.average_rating || book.score || null);
      const avg = (book.average_rating !== undefined && book.average_rating !== null) ? book.average_rating : null;
      const customTags = book.tags || [];

      div.innerHTML = `
        <div style="height:160px; margin-bottom:10px;">
          <img src="${cover}" alt="${title}" style="width:100%;height:100%;object-fit:cover;border-radius:8px;" onerror="this.onerror=null;this.src='https://placehold.co/160x240/333333/cccccc?text=No+Cover'"/>
        </div>
        <div>
          <div class="text-lg font-semibold">${escapeHtml(title)}</div>
          <div class="muted small">${escapeHtml(authors)}</div>
          <div class="mt-2">
            ${renderStars(avg)}
            ${rating ? `<span class="small muted ml-2">${rating}</span>` : ''}
          </div>
          <div class="mt-2 small muted">Rated by: ${escapeHtml(rated_by)}</div>
                    ${customTags.length > 0 ? `
            <div class="mt-2 flex flex-wrap gap-2">
                ${customTags.map(tag => `<span class="bg-blue-600 rounded-full px-2 py-1 text-xs text-white">${escapeHtml(tag)}</span>`).join('')}
            </div>` : ''
          }
          ${ showScores && scoreInfo ? `
            <div class="mt-3 small muted">
              <div>Content: ${(scoreInfo.content_score*100||0).toFixed(0)}%</div>
              <div>Collaborative: ${(scoreInfo.collab_score*100||0).toFixed(0)}%</div>
              <div>Hybrid: ${(scoreInfo.hybrid_score*100||0).toFixed(0)}%</div>
            </div>` : ''
          }
        </div>
      `;

      // click to go to summary page (if your app has it)
      div.style.cursor = 'pointer';
      div.addEventListener('click', () => {
        const bookId = book.id || book.book_id || book._id;
        if (bookId) window.location = `/summary?bookId=${encodeURIComponent(bookId)}`;
      });

      return div;
    }

    function renderStars(rating) {
      if (!rating) {
        return `<span class="muted small">Rating</span>`;
      }
      const r = Math.round(Number(rating));
      let html = '<span class="stars">';
      for (let i=1;i<=5;i++){
        html += (i<=r) ? '<i class="fas fa-star"></i>' : '<i class="far fa-star"></i>';
      }
      html += '</span>';
      return html;
    }

    // Escape helper to avoid accidental HTML injection
    function escapeHtml(s) {
      if (!s && s !== 0) return '';
      return String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
    }

    // Fetch hybrid recommendations (POST to /api/recommendations/hybrid)
    async function fetchHybrid(tags, alpha=0.5) {
      resultsWrap.innerHTML = '';
      noResults.classList.add('hidden');
      showMessage('Fetching recommendations...');

      // Prepare payload
      // Only allow authenticated users
      if (!currentUser || !currentUser.uid) {
        showMessage('Collecting user recommendations. Click the "Fetch" button');
        return;
      }
      const payload = { user_id: currentUser.uid, tags, alpha };

      const headers = { "Content-Type": "application/json" };
      // Assuming Firebase Auth is already initialized
        if (currentUser) {
          try {
            const idToken = await currentUser.getIdToken(true);
            const resUserInfo = await fetch("http://127.0.0.1:8000/api/user-info", {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                "Authorization": "Bearer " + idToken
              },
              body: JSON.stringify({})
            });
            const data = await resUserInfo.json();
            console.log("User info response:", data);
          } catch (err) {
            console.error("Error getting user info:", err);
          }
        }
      if (currentIdToken) headers["Authorization"] = `Bearer ${currentIdToken}`;

      try {
        const res = await fetch('/api/recommendations/hybrid', {
          method: 'POST',
          headers,
          body: JSON.stringify(payload)
        });

        if (!res.ok) {
          const txt = await res.text();
          console.error('Hybrid API error', res.status, txt);
          showMessage(`Server error: ${res.status}`, 3000);
          noResults.classList.remove('hidden');
          return;
        }

        const data = await res.json();
        // Accept both { recommendations: [...] } and direct array
        const recs = data?.recommendations || data || [];

        if (!Array.isArray(recs) || recs.length === 0) {
          noResults.classList.remove('hidden');
          return;
        }

        // Render
        resultsWrap.innerHTML = '';
        recs.forEach(r => {
          // normalize fields
          const book = {
            id: r.id || r.book_id || r.bookId,
            title: r.title || r.name,
            author: r.author || r.authors,
            coverUrl: r.coverUrl || r.cover || r.coverUrl || r.image,
            rating: r.rating || r.user_rating || r.score || r.average_rating,
            rated_by: r.rated_by || r.owner || r.ratedBy,
            tags: r.customTags || []
          };
          const scoreInfo = { content_score: r.content_score||0, collab_score: r.collab_score||0, hybrid_score: r.hybrid_score||(r.hybrid_score||0) };
          resultsWrap.appendChild(renderCard(book, scoreInfo));
        });

      } catch (err) {
        console.error("Fetch failed:", err);
        showMessage('Network error while fetching recommendations', 3000);
        noResults.classList.remove('hidden');
      }
    }

    // UI wiring
    fetchBtn.addEventListener('click', () => {
      const tags = tagInput.value.split(',').map(s=>s.trim()).filter(Boolean);
      if (tags.length === 0) { showMessage('Please enter tags'); return; }
      fetchHybrid(tags, parseFloat(alphaSlider.value));
    });

    alphaSlider.addEventListener('input', (e) => {
      alphaVal.textContent = Number(e.target.value).toFixed(1);
    });

    modeBtn.addEventListener('click', () => {
      currentMode = currentMode === 'hybrid' ? 'content' : 'hybrid';
      modeBtn.childNodes[0].nodeValue = currentMode === 'hybrid' ? 'Hybrid' : 'Content';
      // when content mode, we can call a by-tags endpoint if you prefer:
      // (This snippet still uses hybrid endpoint but sets alpha=0 for 'content')
    });

    scoreToggle.addEventListener('change', (e) => {
      showScores = e.target.checked;
      // simply refetch using same tags if exists
      const tags = tagInput.value.split(',').map(s=>s.trim()).filter(Boolean);
      if (tags.length) fetchHybrid(tags, parseFloat(alphaSlider.value));
    });

    // Load tags from URL if present
    window.addEventListener('load', () => {
      const tags = parseUrlTags();
      if (tags.length) {
        tagInput.value = tags.join(',');
        // auto fetch
        fetchHybrid(tags, parseFloat(alphaSlider.value));
      }
    });

    modeBtn.addEventListener('mouseenter', () => { modeTooltip.style.display = 'block'; });
    modeBtn.addEventListener('mouseleave', () => { modeTooltip.style.display = 'none'; });
  </script>
</body>
</html>
