<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>BookHub — Book Statistics</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet"/>
  <style>
    body { background:#0b1220; color:#e6eef8; font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,"Helvetica Neue",Arial;}
    .card { background:#0f1724; border:1px solid rgba(255,255,255,0.03); border-radius:12px; padding:14px; }
  </style>
</head>
<body class="min-h-screen p-6">
  <div class="max-w-5xl mx-auto">
    <div class="back-button-container mb-6">
        <a href="/recommendations" class="back-button-link">&#8592; Back to Recommendations</a>
    </div>
    <header class="flex items-center justify-between mb-6">
      <h1 class="text-2xl font-bold">Book Statistics</h1>
      <div id="userBox" class="text-sm muted"></div>
    </header>

    <div class="card">
      <h2 class="text-lg font-semibold mb-4">Individual User Statistics</h2>
      <table class="w-full text-left">
        <thead>
          <tr class="border-b">
            <th class="py-2">User ID</th>
            <th class="py-2">Rating</th>
            <th class="py-2">Reading Time (min)</th>
            <th class="py-2">Completed</th>
          </tr>
        </thead>
        <tbody id="statsTable">
          <tr>
            <td colspan="4" class="py-4 text-center">Loading...</td>
          </tr>
        </tbody>
      </table>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mt-6">
      <div class="card">
        <h2 class="text-lg font-semibold mb-4">Rating Distribution</h2>
        <canvas id="ratingChart"></canvas>
      </div>
      <div class="card">
        <h2 class="text-lg font-semibold mb-4">Average Time Spent Reading</h2>
        <canvas id="timeChart"></canvas>
      </div>
      <div class="card">
        <h2 class="text-lg font-semibold mb-4">Completion Rate</h2>
        <canvas id="completionChart"></canvas>
      </div>
      <div class="card">
        <h2 class="text-lg font-semibold mb-4">Total Reading Time per User</h2>
        <canvas id="userTimeChart"></canvas>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

    //firebase configurations
    const firebaseConfig = {
      apiKey: "AIzaSyCTbjfadYocNBVdQpo_KzuW5JEtZS38Pkw",
      authDomain: "bookhub-80381.firebaseapp.com",
      projectId: "bookhub-80381",
      storageBucket: "bookhub-80381.firebasestorage.app",
      messagingSenderId: "525454852384",
      appId: "1:525454852384:web:1910c936f8062125779745"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    let currentUser = null;
    let currentIdToken = null;

    const userBox = document.getElementById('userBox');
    onAuthStateChanged(auth, async (u) => {
      currentUser = u;
      if (u) {
        userBox.textContent = u.email ? `Signed in: ${u.email}` : `User: ${u.uid}`;
        try {
          currentIdToken = await u.getIdToken();
          loadStatistics();
        } catch (err) {
          console.warn("Could not get ID token:", err);
          currentIdToken = null;
        }
      } else {
        document.body.innerHTML = `<div style='display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;background:#0b1220;color:#e6eef8;font-family:Inter,sans-serif;'><h2 style='margin-bottom:1.5rem;'>You must be logged in to view statistics.</h2><div style='display:flex;gap:2rem;'><a href='/login' style='background:#14b8a6;color:#fff;padding:0.75rem 2rem;border-radius:8px;text-decoration:none;font-weight:600;'>Go to Login</a><a href='/register' style='background:#06b6d4;color:#fff;padding:0.75rem 2rem;border-radius:8px;text-decoration:none;font-weight:600;'>Register</a></div></div>`;
      }
    });
    //All feature listed below are placeholders
    async function loadStatistics() {
      const urlParams = new URLSearchParams(window.location.search);
      const bookId = urlParams.get('bookId');
      if (!bookId) {
        alert('No book ID provided');
        return;
      }

      try {
        const res = await fetch(`/api/book-statistics/${bookId}`, {
          headers: {
            'Authorization': `Bearer ${currentIdToken}`
          }
        });

        if (!res.ok) {
          throw new Error(`HTTP ${res.status}`);
        }

        const data = await res.json();

        const tableBody = document.getElementById('statsTable');
        tableBody.innerHTML = '';

        if (data.user_data && data.user_data.length > 0) {
          data.user_data.forEach(user => {
            const row = document.createElement('tr');
            row.className = 'border-b';
            row.innerHTML = `
              <td class="py-2">${user.user_id}</td>
              <td class="py-2">${user.rating || 'N/A'}</td>
              <td class="py-2">${user.reading_time || 0}</td>
              <td class="py-2">${user.completed ? 'Yes' : 'No'}</td>
            `;
            tableBody.appendChild(row);
          });
        } else {
          tableBody.innerHTML = '<tr><td colspan="4" class="py-4 text-center">No data available</td></tr>';
        }

      } catch (err) {
        console.error('Error loading statistics:', err);
        alert('Error loading statistics');
      }
    }
    
    function renderCharts() {
      // Rating Distribution Bar Chart
      const ratingCtx = document.getElementById('ratingChart').getContext('2d');
      new Chart(ratingCtx, {
        type: 'bar',
        data: {
          labels: ['1 Star', '2 Stars', '3 Stars', '4 Stars', '5 Stars'],
          datasets: [{
            label: 'Number of Users',
            data: [5, 10, 15, 20, 25],
            backgroundColor: 'rgba(20, 184, 166, 0.6)',
            borderColor: 'rgba(20, 184, 166, 1)',
            borderWidth: 1
          }]
        },
        options: {
          scales: {
            y: {
              beginAtZero: true,
              ticks: { color: '#e6eef8' },
              grid: { color: 'rgba(255,255,255,0.1)' }
            },
            x: {
              ticks: { color: '#e6eef8' },
              grid: { color: 'rgba(255,255,255,0.1)' }
            }
          },
          plugins: {
            legend: { labels: { color: '#e6eef8' } }
          }
        }
      });

      // Average Time Spent Pie Chart
      const timeCtx = document.getElementById('timeChart').getContext('2d');
      new Chart(timeCtx, {
        type: 'pie',
        data: {
          labels: ['<30 min', '30-60 min', '1-2 hours', '2-4 hours', '>4 hours'],
          datasets: [{
            data: [10, 20, 15, 5, 2],
            backgroundColor: [
              'rgba(20, 184, 166, 0.6)',
              'rgba(6, 182, 212, 0.6)',
              'rgba(139, 92, 246, 0.6)',
              'rgba(236, 72, 153, 0.6)',
              'rgba(245, 158, 11, 0.6)'
            ],
            borderColor: [
              'rgba(20, 184, 166, 1)',
              'rgba(6, 182, 212, 1)',
              'rgba(139, 92, 246, 1)',
              'rgba(236, 72, 153, 1)',
              'rgba(245, 158, 11, 1)'
            ],
            borderWidth: 1
          }]
        },
        options: {
          plugins: {
            legend: { labels: { color: '#e6eef8' } }
          }
        }
      });

      // Completion Rate Pie Chart
      const completionCtx = document.getElementById('completionChart').getContext('2d');
      new Chart(completionCtx, {
        type: 'pie',
        data: {
          labels: ['Completed', 'Not Completed'],
          datasets: [{
            data: [70, 30],
            backgroundColor: [
              'rgba(34, 197, 94, 0.6)',
              'rgba(239, 68, 68, 0.6)'
            ],
            borderColor: [
              'rgba(34, 197, 94, 1)',
              'rgba(239, 68, 68, 1)'
            ],
            borderWidth: 1
          }]
        },
        options: {
          plugins: {
            legend: { labels: { color: '#e6eef8' } }
          }
        }
      });

      // Total Reading Time per User Bar Chart
      const userTimeCtx = document.getElementById('userTimeChart').getContext('2d');
      new Chart(userTimeCtx, {
        type: 'bar',
        data: {
          labels: ['User1', 'User2', 'User3', 'User4', 'User5'],
          datasets: [{
            label: 'Reading Time (minutes)',
            data: [120, 90, 200, 150, 80],
            backgroundColor: 'rgba(139, 92, 246, 0.6)',
            borderColor: 'rgba(139, 92, 246, 1)',
            borderWidth: 1
          }]
        },
        options: {
          scales: {
            y: {
              beginAtZero: true,
              ticks: { color: '#e6eef8' },
              grid: { color: 'rgba(255,255,255,0.1)' }
            },
            x: {
              ticks: { color: '#e6eef8' },
              grid: { color: 'rgba(255,255,255,0.1)' }
            }
          },
          plugins: {
            legend: { labels: { color: '#e6eef8' } }
          }
        }
      });
    }

    // Render charts on page load
    renderCharts();
  </script>
</body>
</html>
