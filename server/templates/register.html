<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Register - BookHub</title>
    <link rel="stylesheet" href="/static/style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="/static/js/auth-check.js" defer></script>
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #0f172a;
            color: #f1f5f9;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            line-height: 1.6;
        }
        
        header {
            background: linear-gradient(135deg, #2d3748 0%, #1a202c 100%);
            padding: 1.2rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
            border-bottom: 1px solid rgba(20, 184, 166, 0.1);
        }
        
        .logo span {
            margin: 0;
            font-weight: 700;
            font-size: 1.9rem;
            color: #ffffff;
            background: linear-gradient(135deg, #14b8a6, #06b6d4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .main-nav ul {
            list-style: none;
            display: flex;
            gap: 2rem;
            margin: 0;
            padding: 0;
        }
        
        .main-nav ul li a {
            color: #e2e8f0;
            text-decoration: none;
            font-weight: 500;
            font-size: 0.95rem;
            transition: all 0.3s ease;
            padding: 0.5rem 1rem;
            border-radius: 6px;
        }
        
        .main-nav ul li a:hover {
            color: #14b8a6;
            background-color: rgba(20, 184, 166, 0.1);
        }
        
        main {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 3rem 2rem;
            position: relative;
        }
        
        .back-link {
            position: absolute;
            top: 2rem;
            left: 2rem;
            color: #14b8a6;
            font-weight: 600;
            text-decoration: none;
            transition: color 0.3s ease;
        }
        
        .back-link:hover {
            color: #06b6d4;
        }
        
        .register-container {
            background: linear-gradient(135deg, 
                rgba(45, 55, 72, 0.95), 
                rgba(26, 32, 44, 0.9));
            padding: 3rem 2.5rem;
            border-radius: 12px;
            backdrop-filter: blur(20px);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.25), 
                        0 0 0 1px rgba(20, 184, 166, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.1);
            width: 100%;
            max-width: 450px;
        }
        
        .register-container h1 {
            text-align: center;
            margin-bottom: 2rem;
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(135deg, #14b8a6, #06b6d4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .register-container h1::after {
            content: "Create your account to get started";
            display: block;
            font-size: 0.9rem;
            font-weight: 400;
            color: #94a3b8;
            margin-top: 0.5rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: #e2e8f0;
            font-weight: 500;
            font-size: 0.95rem;
        }

        .form-group input {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            background: rgba(15, 23, 42, 0.5);
            color: #f1f5f9;
            font-size: 1rem;
            transition: all 0.3s ease;
            box-sizing: border-box;
        }

        .form-group input:focus {
            outline: none;
            border-color: #14b8a6;
            box-shadow: 0 0 0 3px rgba(20, 184, 166, 0.1);
        }

        .form-group input::placeholder {
            color: #64748b;
            font-style: italic;
        }

        .password-container {
            position: relative;
        }
        
        .register-btn {
            width: 100%;
            padding: 0.875rem;
            background: linear-gradient(135deg, #14b8a6, #06b6d4);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 1.5rem;
        }
        
        .register-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 10px 25px rgba(20, 184, 166, 0.3);
        }
        
        .login-link {
            text-align: center;
            color: #94a3b8;
        }
        
        .login-link a {
            color: #14b8a6;
            text-decoration: none;
            font-weight: 600;
        }
        
        .login-link a:hover {
            color: #06b6d4;
        }
        
        .error {
            color: #f87171;
            text-align: center;
            margin-top: 1rem;
            padding: 0.75rem;
            background: rgba(248, 113, 113, 0.1);
            border-radius: 6px;
            border: 1px solid rgba(248, 113, 113, 0.2);
        }
        
        footer {
            background: linear-gradient(135deg, #2d3748 0%, #1a202c 100%);
            color: #94a3b8;
            text-align: center;
            padding: 1.5rem 0;
            font-size: 0.875rem;
            border-top: 1px solid rgba(20, 184, 166, 0.1);
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            position: relative;
        }
        
        @media (max-width: 768px) {
            header {
                flex-direction: column;
                gap: 1rem;
                padding: 1rem;
            }
            
            .main-nav ul {
                gap: 1rem;
            }
            
            .register-container {
                padding: 2rem 1.5rem;
                margin: 0 1rem;
            }
            
            main {
                padding: 2rem 1rem;
            }
            
            .back-link {
                position: static;
                margin-bottom: 2rem;
            }
        }
    </style>
</head>
<body>
    <header class="site-header">
        <div class="logo">
            <span>BookHub</span>
        </div>
        <nav class="main-nav">
            <ul>
                <li><a href="/" id="homeTab">Home</a></li>
                <li><a href="/bookTracking" id="bookTrackingTab">Book Tracking</a></li>
                <li><a href="/register" id="registerTab">Register</a></li>
                <li><a href="/searchResult" id="searchResultTab">Book Search</a></li>
                <li><a href="/faq" id="faqTab">FAQ</a></li>
                <li><a href="/profile" id="profileTab">Profile</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <a href="/" class="back-link">← Back to Home</a>
        
        <div class="register-container">
            <h1>Register</h1>
            <form id="registerForm">
                <div class="form-group">
                    <label for="username">Choose a Username</label>
                    <input type="text" id="username" placeholder="Enter your unique username" required />
                </div>
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" placeholder="your.email@example.com" required />
                </div>
                <div class="form-group">
                    <label for="password">Create Password</label>
                    <input type="password" id="password" placeholder="Minimum 6 characters" required />
                </div>
                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <input type="password" id="confirmPassword" placeholder="Re-enter your password" required />
                </div>
                <button type="submit" class="register-btn">Create Account</button>
                <div class="login-link">
                    Already have an account? <a href="/login">Log in here</a>
                </div>
                <div id="error-message" class="error" style="display: none;"></div>
            </form>
        </div>
    </main>

    <footer id="protected-footer">
        &copy; 2024 BookHub. All rights reserved. | Content protected by digital rights management.
    </footer>

    <div class="copy-protection-notice" id="copyNotice" style="position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(239, 68, 68, 0.95); color: white; padding: 1rem 2rem; border-radius: 8px; font-weight: 600; z-index: 1000; display: none; box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);">
        Content is protected. Copying is not allowed.
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCTbjfadYocNBVdQpo_KzuW5JEtZS38Pkw",
            authDomain: "bookhub-80381.firebaseapp.com",
            projectId: "bookhub-80381",
            storageBucket: "bookhub-80381.firebasestorage.app",
            messagingSenderId: "525454852384",
            appId: "1:525454852384:web:1910c936f8062125779745",
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Logo click handler - redirect to home
        const logo = document.querySelector('.logo span');
        if (logo) {
            logo.style.cursor = 'pointer';
            logo.addEventListener('click', () => {
                window.location.href = '/';
            });
        }

        // Copy protection functionality
        document.addEventListener('DOMContentLoaded', function() {
            const footer = document.getElementById('protected-footer');
            const copyNotice = document.getElementById('copyNotice');

            // Disable right-click context menu
            document.addEventListener('contextmenu', function(e) {
                e.preventDefault();
                showCopyNotice();
                return false;
            });

            // Disable common keyboard shortcuts
            document.addEventListener('keydown', function(e) {
                if (e.ctrlKey && (e.key === 'a' || e.key === 'c' || e.key === 'v' || e.key === 'x' || e.key === 's')) {
                    e.preventDefault();
                    showCopyNotice();
                    return false;
                }
                if (e.key === 'F12' || (e.ctrlKey && e.shiftKey && e.key === 'I') || (e.ctrlKey && e.key === 'u')) {
                    e.preventDefault();
                    showCopyNotice();
                    return false;
                }
            });

            // Disable text selection on footer
            if (footer) {
                footer.addEventListener('selectstart', function(e) {
                    e.preventDefault();
                    showCopyNotice();
                    return false;
                });

                footer.addEventListener('dragstart', function(e) {
                    e.preventDefault();
                    showCopyNotice();
                    return false;
                });
            }

            function showCopyNotice() {
                copyNotice.style.display = 'block';
                setTimeout(function() {
                    copyNotice.style.display = 'none';
                }, 2000);
            }

            // Additional protection: Clear clipboard if copy is attempted
            document.addEventListener('copy', function(e) {
                e.clipboardData.setData('text/plain', '');
                e.preventDefault();
                showCopyNotice();
            });

            // Password toggle functionality
            const passwordToggle = document.getElementById('passwordToggle');
            const passwordInput = document.getElementById('password');

            if (passwordToggle && passwordInput) {
                passwordToggle.addEventListener('click', function() {
                    if (passwordInput.type === 'password') {
                        passwordInput.type = 'text';
                        passwordToggle.setAttribute('aria-label', 'Hide password');
                        passwordToggle.style.color = '#14b8a6';
                    } else {
                        passwordInput.type = 'password';
                        passwordToggle.setAttribute('aria-label', 'Show password');
                        passwordToggle.style.color = '#94a3b8';
                    }
                });
            }
        });

        document.getElementById("registerForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            const username = document.getElementById("username").value.trim();
            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;
            const confirmPassword = document.getElementById("confirmPassword").value;
            const errorMsg = document.getElementById("error-message");
            errorMsg.style.display = "none";

            if (!username || !email || !password || !confirmPassword) {
                errorMsg.innerText = "All fields are required.";
                errorMsg.style.display = "block";
                return;
            }

            // Check if passwords match
            if (password !== confirmPassword) {
                errorMsg.innerText = "Passwords do not match. Please try again.";
                errorMsg.style.display = "block";
                return;
            }

            if (password.length < 6) {
                errorMsg.innerText = "Password should be at least 6 characters long.";
                errorMsg.style.display = "block";
                return;
            }

            try {
                const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;

                // Store additional user data in Firestore under users collection
                await setDoc(doc(db, `artifacts/${firebaseConfig.projectId}/users/${user.uid}`), {
                    username: username,
                    email: email,
                    createdAt: new Date(),
                    lastLogin: new Date(),
                });

                console.log("User registered successfully:", user.uid);
                window.location.href = "/"; // Redirect to homepage
            } catch (error) {
                console.error("Registration error:", error);
                let errorMessage = error.message;

                if (error.code === "auth/email-already-in-use") {
                    errorMessage = "This email is already registered. Please use a different email or try logging in.";
                } else if (error.code === "auth/weak-password") {
                    errorMessage = "Password should be at least 6 characters long.";
                } else if (error.code === "auth/invalid-email") {
                    errorMessage = "Please enter a valid email address.";
                }

                errorMsg.innerText = errorMessage;
                errorMsg.style.display = "block";
            }
        });
    </script>
</body>
</html>
