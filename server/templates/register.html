<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Register - BookHub</title>
    <link rel="stylesheet" href="/static/style.css" />
    <script src="/static/js/auth-check.js" defer></script>
</head>
<body>
    <header class="site-header">
        <div class="logo">
            <img src="/static/images/logo-placeholder.png" alt="BookHub Logo" />
            <span>BookHub</span>
        </div>
        <nav class="main-nav">
            <ul>
                <li><a href="/" id="homeTab">Home</a></li>
                <li><a href="/bookTracking" id="bookTrackingTab">Book Tracking</a></li>
                <li><a href="/register" id="registerTab">Register</a></li>
                <li><a href="/searchResult" id="searchResultTab">Book Search</a></li>
                <li><a href="/faq" id="faqTab">FAQ</a></li>
            </ul>
        </nav>
    </header>

    <div style="max-width: 480px; margin: 2rem auto 1rem auto; padding: 1rem;">
        <div style="margin-bottom: 1rem; white-space: nowrap;">
            <a href="/" style="color: #3b82f6; font-weight: bold; text-decoration: none;">← Back to Home</a>
        </div>
    </div>

    <div style="max-width: 480px; margin: 0 auto; padding: 1rem;">
        <h1 style="text-align: center; margin-bottom: 1rem;">Register</h1>
        <form id="registerForm" style="display: flex; flex-direction: column; gap: 1rem;">
            <div>
                <label for="username">Username:</label>
                <input
                    type="text"
                    id="username"
                    required
                    style="width: 100%; padding: 0.5rem; border-radius: 0.25rem; border: 1px solid #ccc"
                />
            </div>
            <div>
                <label for="email">Email:</label>
                <input
                    type="email"
                    id="email"
                    required
                    style="width: 100%; padding: 0.5rem; border-radius: 0.25rem; border: 1px solid #ccc"
                />
            </div>
            <div>
                <label for="password">Password:</label>
                <input
                    type="password"
                    id="password"
                    required
                    style="width: 100%; padding: 0.5rem; border-radius: 0.25rem; border: 1px solid #ccc"
                />
            </div>
            <button
                type="submit"
                style="padding: 0.75rem; background-color: #3b82f6; color: white; border: none; border-radius: 0.375rem; cursor: pointer; font-weight: bold"
            >
                Register
            </button>
        </form>
        <div id="error-message" class="error" style="color: red; margin-top: 0.5rem"></div>
        <p style="text-align: center; margin-top: 20px">
            Already have an account? <a href="/login">Login here</a>
        </p>
    </div>

    <footer
        style="max-width: 480px; margin: 0 auto 2rem auto; padding: 1rem; text-align: center; color: #666; font-size: 0.875rem"
    >
        &copy; 2024 BookHub. All rights reserved.
    </footer>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCTbjfadYocNBVdQpo_KzuW5JEtZS38Pkw",
            authDomain: "bookhub-80381.firebaseapp.com",
            projectId: "bookhub-80381",
            storageBucket: "bookhub-80381.firebasestorage.app",
            messagingSenderId: "525454852384",
            appId: "1:525454852384:web:1910c936f8062125779745",
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        document.getElementById("registerForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            const username = document.getElementById("username").value.trim();
            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;

            if (!username || !email || !password) {
                document.getElementById("error-message").innerText = "All fields are required.";
                return;
            }

            try {
                const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;

                // Store additional user data in Firestore under users collection
                await setDoc(doc(db, `artifacts/${firebaseConfig.projectId}/users/${user.uid}`), {
                    username: username,
                    email: email,
                    createdAt: new Date(),
                    lastLogin: new Date(),
                });

                console.log("User registered successfully:", user.uid);
                window.location.href = "/"; // Redirect to homepage
            } catch (error) {
                console.error("Registration error:", error);
                let errorMessage = error.message;

                if (error.code === "auth/email-already-in-use") {
                    errorMessage = "This email is already registered. Please use a different email or try logging in.";
                } else if (error.code === "auth/weak-password") {
                    errorMessage = "Password should be at least 6 characters long.";
                } else if (error.code === "auth/invalid-email") {
                    errorMessage = "Please enter a valid email address.";
                }

                document.getElementById("error-message").innerText = errorMessage;
            }
        });
    </script>
</body>
</html>
