<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BookHub Search Interface</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: "Inter", sans-serif;
            background-color: #0b1220;
            color: #f1f5f9;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 1.5rem;
            box-sizing: border-box;
            user-select: none;
        }
        .book-title a {
            user-select: text;
            color: #14b8a6;
            text-decoration: none;
        }
        .book-title a:hover {
            color: #06b6d4;
        }
        .container {
            background-color: #1a2233;
            padding: 2rem;
            border-radius: 0.5rem;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            width: 100%;
            max-width: 48rem;
        }
        .message-box {
            position: fixed;
            top: 1rem;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(135deg, #14b8a6, #06b6d4);
            color: white;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            box-shadow: 0 10px 25px rgba(20, 184, 166, 0.3);
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }
        .message-box.show {
            opacity: 1;
            visibility: visible;
        }
        .message-box.error {
            background: rgba(248, 113, 113, 0.95);
            box-shadow: 0 10px 25px rgba(248, 113, 113, 0.3);
        }
        .book-result-card {
            display: flex;
            gap: 1rem;
            background-color: #1a2233;
            padding: 1rem;
            border-radius: 0.5rem;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            align-items: flex-start;
        }
        .book-result-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
        }
        .book-cover-container {
            flex-shrink: 0;
            width: 100px;
            height: 150px;
            background-color: #e0e0e0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            text-align: center;
            color: #666;
            overflow: hidden;
            border-radius: 4px;
        }
        .book-cover-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .book-content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .book-info-text {
            margin-bottom: 0.5rem;
        }
        .book-title {
            font-size: 1.125rem;
            font-weight: bold;
            color: #f1f5f9;
            margin-bottom: 0.25rem;
        }
        .book-genres, .book-description, .book-author-price, .book-rating, .book-source {
            font-size: 0.875rem;
            color: #e2e8f0;
            margin-top: 0.125rem;
        }
        .book-description {
            max-height: 3em;
            overflow: hidden;
            text-overflow: ellipsis;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
        }
        .add-book-button {
            background: linear-gradient(135deg, #14b8a6, #06b6d4);
            color: white;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(20, 184, 166, 0.3);
            transition: all 0.3s ease;
            font-size: 0.875rem;
            cursor: pointer;
            align-self: flex-end;
            margin-top: 0.5rem;
            border: none;
        }
        .add-book-button:hover {
            transform: translateY(-1px);
            box-shadow: 0 10px 25px rgba(20, 184, 166, 0.3);
        }
        .loading-spinner {
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-left-color: #14b8a6;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
            display: inline-block;
            vertical-align: middle;
            margin-left: 0.5rem;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Responsive adjustments for smaller screens */
        @media (max-width: 639px) {
            .book-result-card {
                flex-direction: column;
                align-items: center;
            }
            .book-cover-container {
                width: 150px;
                height: 225px;
                margin-bottom: 1rem;
            }
            .book-content {
                width: 100%;
                align-items: center;
            }
            .book-info-text {
                text-align: center;
            }
            .add-book-button {
                width: 100%;
                align-self: stretch;
            }
        }
    </style>
</head>
<body>
    <main style="width: 100%; padding: 40px 0; background-color: #0b1220; display: flex; justify-content: center;">
        <div class="container" style="background-color: #1a2233; padding: 2rem; border-radius: 0.5rem; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04); max-width: 600px; width: 100%;">
            <h1 style="font-size: 2.25rem; font-weight: bold; color: #f1f5f9; margin-bottom: 1.5rem; text-align: center;">Explore</h1>

        <!-- Search Form -->
        <form id="searchForm" style="display: flex; flex-direction: column; gap: 1rem; margin-bottom: 2rem;">
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                <input
                    type="text"
                    id="searchInput"
                    name="title"
                    placeholder="Book title"
                    style="padding: 0.75rem 1rem; border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 8px; background: rgba(15, 23, 42, 0.5); color: #f1f5f9; font-size: 1rem; transition: all 0.3s ease; box-sizing: border-box;"
                />
                <input
                    type="text"
                    id="authorInput"
                    name="author"
                    placeholder="Author"
                    style="padding: 0.75rem 1rem; border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 8px; background: rgba(15, 23, 42, 0.5); color: #f1f5f9; font-size: 1rem; transition: all 0.3s ease; box-sizing: border-box;"
                />
            </div>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                <input
                    type="text"
                    id="yearInput"
                    name="year"
                    placeholder="Year (e.g., 2020)"
                    style="padding: 0.75rem 1rem; border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 8px; background: rgba(15, 23, 42, 0.5); color: #f1f5f9; font-size: 1rem; transition: all 0.3s ease; box-sizing: border-box;"
                />
                <input
                    type="text"
                    id="genreInput"
                    name="genre"
                    placeholder="Genre/Subject"
                    style="padding: 0.75rem 1rem; border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 8px; background: rgba(15, 23, 42, 0.5); color: #f1f5f9; font-size: 1rem; transition: all 0.3s ease; box-sizing: border-box;"
                />
            </div>
            <div style="display: flex; gap: 1rem;">
                <button
                    type="submit"
                    id="searchButton"
                    style="background: linear-gradient(135deg, #14b8a6, #06b6d4); color: white; padding: 0.75rem 1.5rem; border-radius: 8px; box-shadow: 0 4px 20px rgba(20, 184, 166, 0.3); transition: all 0.3s ease; font-size: 1rem; cursor: pointer; border: none; flex-grow: 1;"
                >
                    Search <span id="loadingSpinner" class="loading-spinner hidden"></span>
                </button>
                <button
                    type="button"
                    id="clearButton"
                    style="background: linear-gradient(135deg, #64748b, #475569); color: white; padding: 0.75rem 1.5rem; border-radius: 8px; box-shadow: 0 4px 20px rgba(100, 116, 139, 0.3); transition: all 0.3s ease; font-size: 1rem; cursor: pointer; border: none;"
                >
                    Clear Filters
                </button>
            </div>
        </form>

            <!-- Search Results Section -->
            <div id="searchResultsContainer" style="display: flex; flex-direction: column; gap: 1rem;">
                <!-- Search results will be dynamically loaded and displayed here by JavaScript -->
                <p id="noResultsMessage" style="color: #94a3b8; text-align: center; margin-top: 2rem;">Search for books online to add to your collection!</p>
                <p id="unregisteredMessage" style="color: #94a3b8; text-align: center; margin-top: 2rem; display:none;">Please log in or register to add books to your collection.</p>
            </div>

            <button onclick="window.location.href='/bookTracking'"
                style="margin-top: 2rem; background: linear-gradient(135deg, #2d3748, #1a202c); color: #f1f5f9; padding: 0.75rem 1.5rem; border-radius: 8px; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15); transition: all 0.3s ease; font-size: 1rem; cursor: pointer; border: none; width: 100%;"
            >
                Back
            </button>
        </div>
    </main>

    <!-- Message Box for notifications -->
    <div id="messageBox" class="message-box"></div>

    <script type="module">
        // Firebase SDK Imports
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, query, where, getDocs } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Your web app's Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyCTbjfadYocNBVdQpo_KzuW5JEtZS38Pkw",
            authDomain: "bookhub-80381.firebaseapp.com",
            projectId: "bookhub-80381",
            storageBucket: "bookhub-80381.firebasestorage.app",
            messagingSenderId: "525454852384",
            appId: "1:525454852384:web:1910c936f8062125779745"
        };

        // Initialize Firebase
        let app;
        let db;
        let auth;
        let userId = null;
        let isAuthReady = false; // Flag to ensure auth is ready before Firestore ops
        // allBooks will now be populated by the online search API
        let allBooks = []; 

        const searchForm = document.getElementById('searchForm');
        const searchInput = document.getElementById('searchInput');
        const authorInput = document.getElementById('authorInput');
        const yearInput = document.getElementById('yearInput');
        const genreInput = document.getElementById('genreInput');
        const searchButton = document.getElementById('searchButton');
        const clearButton = document.getElementById('clearButton');
        const searchResultsContainer = document.getElementById('searchResultsContainer');
        const noResultsMessage = document.getElementById('noResultsMessage');
        const messageBox = document.getElementById('messageBox');
        const loadingSpinner = document.getElementById('loadingSpinner');


        // Function to show messages
        function showMessage(message, isError = false) {
            messageBox.textContent = message;
            messageBox.className = 'message-box show'; // Reset classes and add 'show'
            if (isError) {
                messageBox.classList.add('error');
            } else {
                messageBox.classList.remove('error'); // Ensure error class is removed for success
            }
            setTimeout(() => {
                messageBox.classList.remove('show');
            }, 3000); // Hide after 3 seconds
        }

        /**
         * Generates an Open Library cover image URL based on book title.
         */
        function getBookCoverUrl(title) {
            if (!title) {
                return "https://placehold.co/100x150/e0e0e0/666666?text=No+Cover";
            }
            // This function is primarily for local display.
            // The combined API will provide more accurate cover URLs if available.
            const encodedTitle = encodeURIComponent(title.toLowerCase().replace(/\s/g, '_').replace(/[^a-z0-9_]/g, ''));
            return `https://covers.openlibrary.org/b/title/${encodedTitle}-M.jpg`;
        }

        /**
         * Fetches the list of books from the new unified Flask backend API.
         */
        async function fetchOnlineBooks(params) {
            loadingSpinner.classList.remove('hidden'); // Show spinner
            searchButton.disabled = true; // Disable button during search
            try {
                const urlParams = new URLSearchParams();
                for (const [key, value] of Object.entries(params)) {
                    if (value.trim()) {
                        urlParams.append(key, value.trim());
                    }
                }
                const response = await fetch(`/api/online-book-search?${urlParams.toString()}`);
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                allBooks = await response.json();
                console.log("Books loaded from online API:", allBooks);
                const searchTerm = Object.values(params).filter(v => v.trim()).join(' ') || '';
                renderSearchResults(allBooks, searchTerm);
            } catch (error) {
                console.error("Could not fetch books from online API:", error);
                showMessage("Error searching books online. Please try again later.", true);
                renderSearchResults([], ''); // Clear results on error
            } finally {
                loadingSpinner.classList.add('hidden'); // Hide spinner
                searchButton.disabled = false; // Re-enable button
            }
        }

        /**
         * Initializes Firebase and sets up authentication.
         */
        async function initializeFirebaseAndAuth() {
            try {
                if (Object.keys(firebaseConfig).length === 0 || !firebaseConfig.apiKey) {
                    console.error("Firebase configuration missing or invalid.");
                    showMessage("Error: Firebase configuration missing.", true);
                    return;
                }

                app = initializeApp(firebaseConfig);
                db = getFirestore(app);
                auth = getAuth(app);
                console.log("Firebase app and Firestore initialized.");

        // Listen for authentication state changes
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                userId = user.uid;
                isAuthReady = true;
                console.log("Firebase Auth Ready. User ID:", userId);

                // Show/hide messages based on user type
                const noResultsMessage = document.getElementById('noResultsMessage');
                const unregisteredMessage = document.getElementById('unregisteredMessage');
                if (user.isAnonymous) {
                    noResultsMessage.style.display = 'none';
                    unregisteredMessage.style.display = 'block';
                } else {
                    noResultsMessage.style.display = 'block';
                    unregisteredMessage.style.display = 'none';
                }
            } else {
                userId = null;
                isAuthReady = false;
                console.log("Firebase Auth State: No user signed in. Attempting anonymous sign-in...");
                try {
                    await signInAnonymously(auth);
                    console.log("Signed in anonymously.");
                } catch (error) {
                    console.error("Error signing in anonymously:", error);
                    showMessage("Error signing in to Firebase.", true);
                }
            }
        });

            } catch (error) {
                console.error("Error initializing Firebase or signing in:", error);
                showMessage(`Error setting up app: ${error.message}`, true);
            }
        }

        /**
         * Parses a string representation of a list (e.g., "['item1', 'item2']") into a JavaScript array.
         * Handles potential errors during parsing.
         * @param {string} genresString - The string to parse.
         * @returns {Array<string>} An array of genre strings, or an empty array if parsing fails.
         */
        function parseGenresString(genresString) {
            if (!genresString) {
                return [];
            }
            // If it's already an array (from the new API), return it directly
            if (Array.isArray(genresString)) {
                return genresString;
            }
            try {
                // Remove single quotes and replace with double quotes for valid JSON parsing
                const jsonString = genresString.replace(/'/g, '"');
                const parsed = JSON.parse(jsonString);
                // Ensure the parsed result is an array
                return Array.isArray(parsed) ? parsed : [];
            } catch (e) {
                console.warn("Could not parse genres string:", genresString, "Error:", e);
                // Fallback: if parsing fails, split by comma and trim, or return as is if single item
                return genresString.split(',').map(item => item.trim().replace(/\[|\]/g, ''));
            }
        }


        /**
         * Performs a search on the fetched list of books.
         * Now triggers the online API search with multiple parameters.
         */
        function performSearch(event) {
            if (event) event.preventDefault(); // Prevent form submission if called from form

            const params = {
                title: searchInput.value.trim(),
                author: authorInput.value.trim(),
                year: yearInput.value.trim(),
                genre: genreInput.value.trim()
            };

            // Check if at least one field is filled
            const hasSearchTerm = Object.values(params).some(value => value);
            if (hasSearchTerm) {
                fetchOnlineBooks(params); // Call the new online search API with params
            } else {
                renderSearchResults([], ''); // Clear results if no search terms
                noResultsMessage.textContent = "Please enter at least one search term.";
                noResultsMessage.style.display = 'block';
            }
        }

        /**
         * Clears all search input fields and results.
         */
        function clearFilters() {
            searchInput.value = '';
            authorInput.value = '';
            yearInput.value = '';
            genreInput.value = '';
            renderSearchResults([], ''); // Clear results
            noResultsMessage.textContent = "Search for books online to add to your collection!";
            noResultsMessage.style.display = 'block';
        }

        /**
         * Renders the search results on the page.
         * @param {Array<Object>} books - An array of book objects to display.
         * @param {string} searchTerm - The search term used (for no results message).
         */
        function renderSearchResults(books, searchTerm) {
            searchResultsContainer.innerHTML = ''; // Clear previous results

            if (books.length === 0) {
                noResultsMessage.textContent = searchTerm ? `No online results found for "${searchTerm}". Try a different query.` : "Search for books online to add to your collection!";
                noResultsMessage.style.display = 'block';
            } else {
                noResultsMessage.style.display = 'none';
                books.forEach(book => {
                    const bookCard = document.createElement('li');
                    bookCard.className = 'book-result-card';

                    // Use the coverUrl provided by the API, or fallback to generic
                    const coverImageUrl = book.coverUrl || getBookCoverUrl(book.title);
                    
                    // The API now returns genres as an array directly
                    const displayGenres = Array.isArray(book.genres) ? book.genres : [];

                    // Create the book info text content
                    const bookInfoHtml = `
                        <div class="book-info-text">
                            <h3 class="book-title">
                                ${book.url ? `<a href="${book.url}" target="_blank" class="hover:underline">${book.title || 'Untitled'}</a>` : `<a href="https://www.google.com/search?q=${encodeURIComponent(book.title + ' ' + (book.author || '') + ' book')}" target="_blank" class="hover:underline">${book.title || 'Untitled'}</a>`}
                            </h3>
                            ${book.author ? `<p class="book-author-price">Author: ${book.author}</p>` : ''}
                            ${book.published_date ? `<p class="book-author-price">Published: ${book.published_date}</p>` : ''}
                            ${book.page_count ? `<p class="book-author-price">Pages: ${book.page_count}</p>` : ''}
                            ${book.average_rating ? `<p class="book-rating">Rating: ${book.average_rating.toFixed(1)} <i class="fas fa-star text-yellow-500"></i> (${book.ratings_count || 0} ratings)</p>` : ''}
                            ${displayGenres.length > 0 ? `<p class="book-genres">Genres: ${displayGenres.join(', ')}</p>` : ''}
                            ${book.description ? `<p class="book-description">Description: ${book.description}</p>` : ''}
                            ${book.source ? `<p class="book-source text-xs mt-1">Source: ${book.source}</p>` : ''}
                        </div>
                    `;

                    // Create the button element separately
                    const addButton = document.createElement('button');
                    addButton.type = "button";
                    addButton.className = "add-book-button";
                    addButton.textContent = "ADD BOOK"; // Set text content directly

                    // Set data attributes on the button element
                    addButton.dataset.title = book.title || '';
                    addButton.dataset.url = book.url || '';
                    addButton.dataset.description = book.description || '';
                    addButton.dataset.genres = JSON.stringify(book.genres || []); // Store as JSON string
                    addButton.dataset.author = book.author || '';
                    addButton.dataset.publishedDate = book.published_date || ''; // Use published_date from API
                    addButton.dataset.pageCount = book.page_count || ''; // Use page_count from API
                    addButton.dataset.averageRating = book.average_rating || 0; // Use average_rating from API
                    addButton.dataset.ratingsCount = book.ratings_count || 0; // Use ratings_count from API
                    addButton.dataset.coverUrl = book.coverUrl || ''; // Use coverUrl from API
                    addButton.dataset.isbn13 = book.isbn_13 || '';
                    addButton.dataset.isbn10 = book.isbn_10 || '';

                    // Append elements to the card
                    bookCard.innerHTML = `
                        <div class="book-cover-container">
                            <img src="${coverImageUrl}" alt="Cover of ${book.title || 'Untitled'}" onerror="this.onerror=null;this.src='https://placehold.co/100x150/e0e0e0/666666?text=No+Cover';" />
                        </div>
                        <div class="book-content">
                            ${bookInfoHtml}
                        </div>
                    `;
                    // Append the button *after* setting innerHTML for the book-content div
                    // Only append the addButton if user is registered (not anonymous)
                    if (isAuthReady && userId && !auth.currentUser.isAnonymous) {
                        bookCard.querySelector('.book-content').appendChild(addButton);
                    }

                    searchResultsContainer.appendChild(bookCard);
                });

                // Attach event listeners to all "ADD BOOK" buttons after rendering
                attachAddBookListeners();
            }
        }

        // Function to attach event listeners to all "ADD BOOK" buttons
        function attachAddBookListeners() {
            const addBookButtons = document.querySelectorAll('.add-book-button');
            addBookButtons.forEach(button => {
                    button.addEventListener('click', async () => {
                        if (!isAuthReady || !userId) {
                            showMessage("App not ready or user not authenticated. Please wait.", true);
                            console.error("Attempted add book before auth ready. isAuthReady:", isAuthReady, "userId:", userId);
                            return;
                        }
                        // Restrict adding books to registered (non-anonymous) users only
                        if (auth.currentUser && auth.currentUser.isAnonymous) {
                            showMessage("Please log in or register to add books to your collection.", true);
                            return;
                        }

                        // Parse genres from the data attribute JSON string into an array
                        const genresString = button.dataset.genres;
                        const parsedGenres = JSON.parse(genresString);

                        const bookToAdd = {
                            title: button.dataset.title,
                            url: button.dataset.url || `https://www.google.com/search?q=${encodeURIComponent(button.dataset.title + ' ' + button.dataset.author + ' book')}`,
                            description: button.dataset.description,
                            genres: parsedGenres,
                            author: button.dataset.author,
                            publishedDate: button.dataset.publishedDate,
                            pageCount: parseInt(button.dataset.pageCount) || 0,
                            averageRating: parseFloat(button.dataset.averageRating) || 0,
                            ratingsCount: parseInt(button.dataset.ratingsCount) || 0,
                            coverUrl: button.dataset.coverUrl,
                            isbn13: button.dataset.isbn13,
                            isbn10: button.dataset.isbn10,
                            addedAt: new Date()
                        };

                        try {
                            const trackedBooksCollectionRef = collection(db, `artifacts/${firebaseConfig.projectId}/users/${userId}/tracked_books`);

                            // Check for duplicates before adding (using title and author as primary check)
                            const q = query(trackedBooksCollectionRef, 
                                            where("title", "==", bookToAdd.title),
                                            where("author", "==", bookToAdd.author));
                            const querySnapshot = await getDocs(q);

                            if (!querySnapshot.empty) {
                                showMessage(`"${bookToAdd.title}" by ${bookToAdd.author} is already in your tracking list!`, true);
                                console.warn(`Duplicate book not added: ${bookToAdd.title}`);
                                return;
                            }

                            await addDoc(trackedBooksCollectionRef, bookToAdd);
                            showMessage(`"${bookToAdd.title}" added to your tracking list!`);
                            console.log(`Successfully added "${bookToAdd.title}" to Firestore.`);

                                if (confirm(`"${bookToAdd.title}" added to your tracking list! Do you want to go to your Track Now page? Click OK to go, Cancel to stay on this page.`)) {
                                    window.location.href = '/bookTracking';
                                } else {
                                    // Stay on the current search page
                                }
                        } catch (error) {
                            console.error("Error adding book to Firestore:", error);
                            if (error.code === 'permission-denied') {
                                showMessage("Permission denied. Check Firestore security rules.", true);
                            } else {
                                showMessage(`Failed to add "${bookToAdd.title}". Error: ${error.message}`, true);
                            }
                        }
                    });
            });
        }

        // Event listeners for search
        searchForm.addEventListener('submit', performSearch);
        clearButton.addEventListener('click', clearFilters);

        // Initialize Firebase and authentication when the window loads
        window.onload = async () => {
            await initializeFirebaseAndAuth();
            // No initial fetch for local CSV books. User must search online.
        };
    </script>
</body>
