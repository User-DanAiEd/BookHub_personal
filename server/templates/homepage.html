<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BookHub - Home</title>
    <link rel="stylesheet" href="/static/style.css" />
    <script type="module" src="/static/js/auth-check.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #f0f0f0;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        header {
            background-color: #1f2937;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        header h1 {
            margin: 0;
            font-weight: 700;
            font-size: 1.8rem;
            color: #ffffff;
        }
        nav ul {
            list-style: none;
            display: flex;
            gap: 1.5rem;
            margin: 0;
            padding: 0;
        }
        nav ul li a {
            color: #f0f0f0;
            text-decoration: none;
            font-weight: 600;
            font-size: 1rem;
            transition: color 0.3s ease;
        }
        nav ul li a:hover {
            color: #3b82f6;
        }
        .user-info {
            color: #f0f0f0;
            font-weight: 600;
            font-size: 1rem;
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        #logoutLink {
            cursor: pointer;
            color: #ef4444;
            font-weight: 700;
            text-decoration: underline;
            display: none;
        }
        main {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
        }
        .welcome-message {
            font-size: 1.5rem;
            text-align: center;
            max-width: 600px;
            line-height: 1.5;
        }
        footer {
            background-color: #1f2937;
            color: #9ca3af;
            text-align: center;
            padding: 1rem 0;
            font-size: 0.875rem;
        }
    </style>
</head>
<body>
    <header class="site-header">
        <h1>BookHub</h1>
        <nav>
            <ul>
                <li><a href="/bookTracking">Book Tracker</a></li>
                <li><a href="/searchResult">Explore</a></li>
                <li><a href="/faq">FAQ</a></li>
            </ul>
        </nav>
        <div class="user-info">
            <span id="userIdDisplay"></span>
            <a id="logoutLink" style="display:none;">Log Out</a>
            <a id="loginLink" href="/login" style="display:none; color: #f0f0f0; text-decoration: none; font-weight: 600;">Login</a>
            <a id="registerLink" href="/register" style="display:none; color: #f0f0f0; text-decoration: none; font-weight: 600;">Register</a>
        </div>
    </header>
    <main>
        <div class="welcome-message">
            Welcome to BookHub! Discover your next favorite book, track your reading progress, and explore personalized recommendations.
        </div>
    </main>
    <footer>
        &copy; 2024 BookHub. All rights reserved.
    </footer>
</body>
</html>
